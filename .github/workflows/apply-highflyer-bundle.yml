name: Apply High-Flyer research bundle

on:
  push:
    paths:
      - .github/workflows/apply-highflyer-bundle.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed research files
        run: tar -xzf highflyer-research-bundle.tar.gz
      - name: Verify privacy
        run: python3 scripts/privacy_check.py
      - name: Commit research module
        run: |
          rm highflyer-research-bundle.tar.gz
          rm .github/workflows/apply-highflyer-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add High-Flyer public footprint research"
          git push
